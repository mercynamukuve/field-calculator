<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>field calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="index.html">
</head>
<body>
    <div class="calculator">
        <input type="text"
        class="calculator-screen"
        name="display"readonly
        placeholder="0"><br><br>

        <div class="keys"
        aria-label="calculator keys"
        <button class="key utility"
        type="button">AC</button>
        <button class="key utility"
        type="button">+/-</button>
        <button class="key utility"
        type="button">%</button>
        <button class="key operator"
        type="button">/</button><br><br>

        <button class="key"
        type="button">7</button>
        <button class="key"
        type="button">8</button>
        <button class="key"
        type="button">9</button>
        <button class="key operator"
        type="button">*</button><br><br>

        <button class="key"
        type="button">4</button>
        <button class="key"
        type="button">5</button>
        <button class="key"
        type="button">6</button>
        <button class="key operator"
        tpe="button">-</button><br><br>

        <button class="key"
        type="button">1</button>
        <button class="key"
        type="button">2</button>
        <button class="key"
        type="button">3</button>
        <button class="key operator"
        type="button">+</button><br><br>

        <button class="key zero"
        type="button">0</button>
        <button class="key"
        type="button">.</button>
        <button class="key equals"
        type="button">=</button><br><br>

    </div>
    
</body>
</html>
